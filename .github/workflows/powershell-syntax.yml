name: DriverHub PowerShell syntax checks

on:
  push:
    paths:
      - 'DriverHub.ps1'
      - 'AsusDrivers.ps1'
      - '.github/workflows/powershell-syntax.yml'
  workflow_dispatch:

jobs:
  powershell-parse:
    name: Parse Windows PowerShell 5.1 files
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse DriverHub and ASUS extension with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($relative in @('DriverHub.ps1','AsusDrivers.ps1')) {
            $file=(Resolve-Path $relative).Path
            $tokens=$null
            $parseErrors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$parseErrors)
            if (@($parseErrors).Count -gt 0) {
              $contents=Get-Content -LiteralPath $file
              foreach($err in $parseErrors) {
                $line=[int]$err.Extent.StartLineNumber
                Write-Host ("Line {0} Col {1}: {2}" -f $line,$err.Extent.StartColumnNumber,$err.Message)
                if($line -ge 1 -and $line -le $contents.Count){Write-Host $contents[$line-1]}
              }
              throw "$relative has $(@($parseErrors).Count) syntax errors"
            }
            Write-Host "$relative syntax OK"
          }
